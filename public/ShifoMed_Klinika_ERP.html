<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShifoMed ERP - Tibbiyot Markazi Boshqaruv Tizimi</title>
  <!-- React 18 & Babel Standalone for Instant Execution -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏥</text></svg>">
  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 font-sans antialiased selection:bg-teal-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function ShifoMedStandaloneApp() {
      const [tab, setTab] = useState('dashboard');
      const [searchTerm, setSearchTerm] = useState('');
      const [showTv, setShowTv] = useState(false);

      // 1. Initial State Data
      const [patients, setPatients] = useState([
        { id: 'PAT-1001', name: 'Alisher Rustamovich Karimov', phone: '+998 90 123-45-67', blood: 'A+', passport: 'AA 1234567', status: 'Ambulator' },
        { id: 'PAT-1002', name: 'Nilufar Baxtiyorovna Saidova', phone: '+998 93 555-12-34', blood: 'O+', passport: 'AB 7654321', status: 'Statsionar' },
        { id: 'PAT-1003', name: 'Jasur Shavkatovich Mirzayev', phone: '+998 97 780-33-22', blood: 'B+', passport: 'AC 9988776', status: 'Ambulator' }
      ]);

      const [doctors, setDoctors] = useState([
        { id: 'DOC-1', name: 'Dr. Ziyoda Rahmonova', specialty: 'Kardiolog', room: 'Xona 204', fee: 180000, phone: '+998 93 322-44-55' },
        { id: 'DOC-2', name: 'Dr. Jahongir Qodirov', specialty: 'Umumiy jarroh', room: 'Xona 305', fee: 200000, phone: '+998 90 911-22-33' },
        { id: 'DOC-3', name: 'Dr. Azizbek Saidov', specialty: 'Stomatolog-ortoped', room: 'Xona 102', fee: 150000, phone: '+998 97 400-11-22' }
      ]);

      const [queue, setQueue] = useState([
        { id: 101, patient: 'Alisher Rustamovich Karimov', doctor: 'Dr. Ziyoda Rahmonova', room: 'Xona 204', time: '09:30', status: 'Qabulda' },
        { id: 102, patient: 'Jasur Shavkatovich Mirzayev', doctor: 'Dr. Ziyoda Rahmonova', room: 'Xona 204', time: '10:15', status: 'Kutilmoqda' },
        { id: 103, patient: 'Nilufar Baxtiyorovna Saidova', doctor: 'Dr. Jahongir Qodirov', room: 'Xona 305', time: '10:45', status: 'Kutilmoqda' }
      ]);

      const [invoices, setInvoices] = useState([
        { id: 'CHK-0901', patient: 'Alisher Rustamovich Karimov', service: 'Kardiolog konsultatsiyasi + EKG', total: 280000, method: 'Uzcard', status: 'To\'landi', date: '2026-09-24' },
        { id: 'CHK-0902', patient: 'Jasur Shavkatovich Mirzayev', service: 'Tibbiy ko\'rik + UZI', total: 290000, method: 'Payme', status: 'To\'landi', date: '2026-09-24' },
        { id: 'CHK-0903', patient: 'Nilufar Baxtiyorovna Saidova', service: 'Statsionar yotoq (1 sutka)', total: 450000, method: 'Naqd pul', status: 'To\'landi', date: '2026-09-24' }
      ]);

      // Dental teeth state
      const [teeth, setTeeth] = useState({
        16: 'Plomba',
        24: 'Karies',
        36: 'Pulipit',
        46: 'Implant'
      });

      // Quick patient addition
      const [newPatName, setNewPatName] = useState('');
      const [newPatPhone, setNewPatPhone] = useState('');
      const [newPatBlood, setNewPatBlood] = useState('A+');

      const handleAddPatient = (e) => {
        e.preventDefault();
        if (!newPatName || !newPatPhone) return;
        const newP = {
          id: `PAT-${Math.floor(1000 + Math.random() * 9000)}`,
          name: newPatName,
          phone: newPatPhone,
          blood: newPatBlood,
          status: 'Ambulator'
        };
        setPatients([newP, ...patients]);
        setNewPatName('');
        setNewPatPhone('');
        alert(`Bemor ${newP.name} bazaga muvaffaqiyatli kiritildi!`);
      };

      // Sound chime for TV Tablo
      const playChime = () => {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.18);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
          osc.start();
          osc.stop(ctx.currentTime + 0.8);
        } catch (e) {}
      };

      const totalRevenue = invoices.reduce((sum, i) => sum + i.total, 0);

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Top Clinical Header */}
          <header className="px-6 py-4 bg-slate-900 border-b border-slate-800 flex items-center justify-between flex-wrap gap-4 no-print">
            <button
              onClick={() => { setTab('dashboard'); setSearchTerm(''); }}
              className="flex items-center gap-3 text-left group cursor-pointer"
            >
              <div className="w-10 h-10 rounded-xl bg-teal-500/20 border border-teal-400 flex items-center justify-center text-xl">
                🏥
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-lg font-black text-white">ShifoMed ERP</h1>
                  <span className="text-[10px] bg-teal-500/20 text-teal-300 px-2 py-0.5 rounded-full font-bold">OFFLINE REJIM</span>
                </div>
                <p className="text-xs text-slate-400">Xususiy Klinika va Tibbiyot Markazi Tizimi</p>
              </div>
            </button>

            <div className="flex items-center gap-3 flex-wrap">
              <input
                type="text"
                placeholder="Bemor yoki shifokor qidirish..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="px-3.5 py-1.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-400 focus:outline-none focus:border-teal-500 w-64"
              />

              <button
                onClick={() => { setShowTv(true); playChime(); }}
                className="px-3.5 py-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg shadow-purple-900/30"
              >
                <span>📺</span>
                <span>Jonli TV Tablo</span>
              </button>

              <button
                onClick={() => window.print()}
                className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold"
              >
                🖨️ Chop etish
              </button>
            </div>
          </header>

          {/* Main Layout */}
          <div className="flex-1 flex flex-col md:flex-row">
            
            {/* Sidebar Navigation */}
            <aside className="w-full md:w-64 p-4 bg-[#0a0f1d] border-r border-slate-800 space-y-2 no-print">
              {[
                { id: 'dashboard', label: 'Boshqaruv Paneli', icon: '📊' },
                { id: 'patients', label: `Bemorlar Bazasi (${patients.length})`, icon: '👥' },
                { id: 'queue', label: `Jonli Navbat (${queue.length})`, icon: '⏱️' },
                { id: 'doctors', label: `Shifokorlar (${doctors.length})`, icon: '🩺' },
                { id: 'billing', label: 'Kassa & Moliya', icon: '💳' },
                { id: 'dental', label: 'Stomatologiya (32 Tish)', icon: '🦷' }
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setTab(item.id)}
                  className={`w-full flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition cursor-pointer text-left ${
                    tab === item.id
                      ? 'bg-teal-600/30 text-teal-300 border border-teal-500/40'
                      : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                  }`}
                >
                  <span className="text-base">{item.icon}</span>
                  <span>{item.label}</span>
                </button>
              ))}

              <div className="pt-4 border-t border-slate-800 text-[11px] text-slate-500 space-y-1">
                <div>Versiya: ShifoMed Standalone v2.4</div>
                <div>Litsenziya: Cheksiz Tijoriy</div>
              </div>
            </aside>

            {/* Content Area */}
            <main className="flex-1 p-6 overflow-y-auto">
              
              {/* TAB 1: DASHBOARD */}
              {tab === 'dashboard' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-white">Klinika Boshqaruv Ko'rsatkichlari</h2>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                      <div className="text-xs text-slate-400">Jami Bemorlar</div>
                      <div className="text-3xl font-bold text-teal-400 mt-2">{patients.length} nafar</div>
                    </div>
                    <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                      <div className="text-xs text-slate-400">Bugungi Navbat</div>
                      <div className="text-3xl font-bold text-amber-400 mt-2">{queue.length} ta</div>
                    </div>
                    <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                      <div className="text-xs text-slate-400">Faol Shifokorlar</div>
                      <div className="text-3xl font-bold text-indigo-400 mt-2">{doctors.length} nafar</div>
                    </div>
                    <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800">
                      <div className="text-xs text-slate-400">Kassa Tushumi</div>
                      <div className="text-3xl font-bold text-emerald-400 mt-2">{totalRevenue.toLocaleString()} so'm</div>
                    </div>
                  </div>

                  {/* Active Queue Snapshot */}
                  <div className="p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                    <h3 className="font-bold text-white flex items-center justify-between">
                      <span>Jonli Navbat Ko'rinishi</span>
                      <button onClick={() => setShowTv(true)} className="text-xs text-teal-400 hover:underline">
                        Katta TV rejimida ochish &rarr;
                      </button>
                    </h3>
                    <div className="space-y-2">
                      {queue.map(q => (
                        <div key={q.id} className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex justify-between items-center text-xs">
                          <div className="flex items-center gap-3">
                            <span className="w-8 h-8 rounded-lg bg-teal-500/20 text-teal-300 font-bold flex items-center justify-center">
                              #{q.id}
                            </span>
                            <div>
                              <div className="font-bold text-white">{q.patient}</div>
                              <div className="text-slate-400">{q.doctor} ({q.room})</div>
                            </div>
                          </div>
                          <span className={`px-2.5 py-1 rounded-full font-bold ${q.status === 'Qabulda' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-800 text-slate-400'}`}>
                            {q.status} ({q.time})
                          </span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 2: PATIENTS */}
              {tab === 'patients' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Bemorlar Bazasi</h2>
                  </div>

                  {/* Quick Add Patient Form */}
                  <form onSubmit={handleAddPatient} className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex flex-wrap gap-3 items-center text-xs">
                    <input
                      type="text"
                      placeholder="Bemor F.I.SH *"
                      required
                      value={newPatName}
                      onChange={e => setNewPatName(e.target.value)}
                      className="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-white flex-1 min-w-[180px]"
                    />
                    <input
                      type="text"
                      placeholder="Telefon raqami *"
                      required
                      value={newPatPhone}
                      onChange={e => setNewPatPhone(e.target.value)}
                      className="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-white w-40"
                    />
                    <select
                      value={newPatBlood}
                      onChange={e => setNewPatBlood(e.target.value)}
                      className="px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-white"
                    >
                      {['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'].map(b => (
                        <option key={b} value={b}>{b}</option>
                      ))}
                    </select>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold transition cursor-pointer"
                    >
                      + Bemor Qo'shish
                    </button>
                  </form>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <table className="w-full text-left text-xs sm:text-sm">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="p-3.5">F.I.SH</th>
                          <th className="p-3.5">Telefon</th>
                          <th className="p-3.5">Qon Guruhi</th>
                          <th className="p-3.5">Holati</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {patients.map(p => (
                          <tr key={p.id} className="hover:bg-slate-800/40">
                            <td className="p-3.5 font-bold text-white">{p.name}</td>
                            <td className="p-3.5">{p.phone}</td>
                            <td className="p-3.5 font-bold text-rose-400">{p.blood}</td>
                            <td className="p-3.5">
                              <span className="px-2.5 py-0.5 rounded-full bg-teal-500/20 text-teal-300 text-xs font-semibold">
                                {p.status}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 3: QUEUE */}
              {tab === 'queue' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Jonli Navbat & Qabullar</h2>
                    <button
                      onClick={() => { setShowTv(true); playChime(); }}
                      className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold"
                    >
                      Kutish Zali Monitori (TV)
                    </button>
                  </div>

                  <div className="space-y-3">
                    {queue.map(q => (
                      <div key={q.id} className="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex justify-between items-center">
                        <div className="flex items-center gap-4">
                          <span className="text-3xl font-black text-teal-400">#{q.id}</span>
                          <div>
                            <div className="text-base font-bold text-white">{q.patient}</div>
                            <div className="text-xs text-slate-400">Shifokor: {q.doctor} ({q.room})</div>
                          </div>
                        </div>
                        <div className="text-right">
                          <div className="text-sm font-bold text-emerald-400">{q.status}</div>
                          <div className="text-xs text-slate-400">{q.time}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 4: DOCTORS */}
              {tab === 'doctors' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-white">Shifokorlar Ro'yxati</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    {doctors.map(d => (
                      <div key={d.id} className="p-5 bg-slate-900 border border-slate-800 rounded-2xl space-y-2">
                        <div className="text-xs uppercase font-bold text-teal-400">{d.specialty}</div>
                        <div className="text-base font-bold text-white">{d.name}</div>
                        <div className="text-xs text-slate-400">{d.room} • Qabul: {d.fee.toLocaleString()} so'm</div>
                        <div className="text-xs text-slate-300">{d.phone}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 5: BILLING */}
              {tab === 'billing' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold text-white">Kassa & Cheklar</h2>
                    <div className="text-base font-bold text-emerald-400">
                      Jami Tushum: {totalRevenue.toLocaleString()} so'm
                    </div>
                  </div>

                  <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <table className="w-full text-left text-xs sm:text-sm">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="p-3.5">Chek №</th>
                          <th className="p-3.5">Bemor</th>
                          <th className="p-3.5">Xizmat</th>
                          <th className="p-3.5">Summa</th>
                          <th className="p-3.5">To'lov Turi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {invoices.map(i => (
                          <tr key={i.id}>
                            <td className="p-3.5 font-mono text-teal-400">{i.id}</td>
                            <td className="p-3.5 font-bold text-white">{i.patient}</td>
                            <td className="p-3.5">{i.service}</td>
                            <td className="p-3.5 font-bold text-emerald-400">{i.total.toLocaleString()} so'm</td>
                            <td className="p-3.5">{i.method}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* TAB 6: DENTAL */}
              {tab === 'dental' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-white">Stomatologiya (32 Tish Formulasi)</h2>
                  
                  <div className="p-6 bg-slate-900 border border-slate-800 rounded-2xl space-y-4">
                    <div className="text-center text-xs font-bold uppercase text-teal-400">Yuqori Jag'</div>
                    <div className="flex justify-center gap-1.5 flex-wrap">
                      {[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28].map(num => (
                        <div key={num} className={`w-10 h-12 rounded-xl p-1 flex flex-col items-center justify-between text-[10px] font-mono font-bold border ${teeth[num] ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                          <span>#{num}</span>
                          <span className="text-[8px]">{teeth[num] || 'Sog\'lom'}</span>
                        </div>
                      ))}
                    </div>

                    <div className="border-t border-slate-800 my-2" />

                    <div className="flex justify-center gap-1.5 flex-wrap">
                      {[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38].map(num => (
                        <div key={num} className={`w-10 h-12 rounded-xl p-1 flex flex-col items-center justify-between text-[10px] font-mono font-bold border ${teeth[num] ? 'bg-rose-500/20 text-rose-300 border-rose-500/40' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                          <span>#{num}</span>
                          <span className="text-[8px]">{teeth[num] || 'Sog\'lom'}</span>
                        </div>
                      ))}
                    </div>
                    <div className="text-center text-xs font-bold uppercase text-teal-400">Pastki Jag'</div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* FULLSCREEN TV TABLO MODAL */}
          {showTv && (
            <div className="fixed inset-0 z-50 bg-[#040812] text-white p-6 flex flex-col justify-between">
              <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">🏥</span>
                  <h1 className="text-2xl font-black text-teal-400">SHIFOMED KUTISH ZALI TABLOSI</h1>
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={playChime} className="px-3 py-1.5 bg-slate-800 rounded-lg text-xs font-bold text-teal-300">
                    🔔 Qo'ng'iroq
                  </button>
                  <button onClick={() => setShowTv(false)} className="px-3 py-1.5 bg-rose-600 rounded-lg text-xs font-bold text-white">
                    ✕ Yopish
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 my-6">
                <div className="p-8 bg-slate-900 border-2 border-emerald-500 rounded-3xl space-y-4">
                  <div className="text-emerald-400 font-bold uppercase text-sm tracking-wider">Hozir Qabulda</div>
                  <div className="text-7xl font-black text-white">#101</div>
                  <div className="text-2xl font-bold text-slate-200">Karimov Alisher</div>
                  <div className="text-xl text-teal-300 font-mono">Xona 204 (Dr. Ziyoda Rahmonova)</div>
                </div>

                <div className="p-8 bg-slate-900 border border-slate-800 rounded-3xl space-y-4">
                  <div className="text-amber-400 font-bold uppercase text-sm tracking-wider">Navbatdagi Bemorlar</div>
                  <div className="space-y-3">
                    <div className="p-3 bg-slate-950 rounded-xl flex justify-between items-center">
                      <span className="text-xl font-bold text-teal-300">#102 Mirzayev Jasur</span>
                      <span className="text-sm text-slate-400">Xona 204 • 10:15</span>
                    </div>
                    <div className="p-3 bg-slate-950 rounded-xl flex justify-between items-center">
                      <span className="text-xl font-bold text-teal-300">#103 Saidova Nilufar</span>
                      <span className="text-sm text-slate-400">Xona 305 • 10:45</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="text-xs text-slate-500 text-center">
                Hurmatli bemorlar, navbatingiz kelganda belgilangan xonaga kiring. Ma'lumot: +998 (71) 200-00-55
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ShifoMedStandaloneApp />);
  </script>
</body>
</html>
